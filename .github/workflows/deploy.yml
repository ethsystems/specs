name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'pull_request' || github.repository == 'ethsystems/specs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Build public artifact
        id: site
        run: |
          set -euo pipefail
          # A symlink in the source tree could point a published page at any
          # file on the runner. Reject it before anything is rendered.
          if git ls-files -s | awk '$1 == "120000" { print "  " $4; found = 1 } END { exit !found }'; then
            echo "::error::the source tree holds the symlinks listed above. Replace them with regular files."
            exit 1
          fi
          source_dir="$(mktemp -d "$RUNNER_TEMP/specs-source.XXXXXX")"
          site_dir="$(mktemp -d "$RUNNER_TEMP/specs-site.XXXXXX")"
          # Render a fresh source tree so stale pages cannot enter the artifact.
          git archive HEAD | tar -x -C "$source_dir"
          bash "$source_dir/scripts/render.sh"
          # check-build.sh derives the publishable set from the source tree and
          # asserts build/ matches it exactly. Adding a specification needs no
          # edit here: add specs/<N>/ and its row in the README.md index table.
          bash "$source_dir/scripts/check-build.sh" "$source_dir" > "$RUNNER_TEMP/verified"
          # Copy only the verified set, so nothing else can reach the artifact.
          while read -r file; do
            mkdir -p "$site_dir/$(dirname "$file")"
            cp "$source_dir/build/$file" "$site_dir/$file"
          done < "$RUNNER_TEMP/verified"
          echo "path=$site_dir" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request' && github.repository == 'ethsystems/specs'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.repository == 'ethsystems/specs'
        with:
          path: ${{ steps.site.outputs.path }}

  deploy:
    # PR runs only validate the build; publication is restricted to the public repo.
    if: github.event_name != 'pull_request' && github.repository == 'ethsystems/specs'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
